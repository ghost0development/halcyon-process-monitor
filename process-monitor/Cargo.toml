[package]
name = "process-monitor"
version = "0.1.0"
edition = "2021"

[dependencies]
aya = { version = "0.13.1", features = ["async_tokio"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
bytes = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
colored = "2"
log = "0.4"
env_logger = "0.11"
ctrlc = "3"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
